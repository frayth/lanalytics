<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/design.css">
  <link rel="stylesheet" href="index.css">
  <title>LAnalytics - Gestion des activités</title>
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="/index.html" aria-label="LAnalytics, accueil"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>LAnalytics</a>
      <nav class="tabs" aria-label="Navigation principale"><a href="/index.html" aria-current="page">Activité</a><a href="/show/show.html">Voir les données</a><a href="/show/analyses.html">Analyses</a></nav>
      <div class="account"><a id="userConnect" href="/log/login.html">Connexion</a><a href="/log/login.html" id="userDisconnect" hidden>Déconnexion</a></div>
    </div>
  </header>

  <h1 class="page-title">Ajouter une activité</h1>
  <main id="showContent" class="container">
    <section id="addContent" class="card">
      <h2>Nouvelle opération</h2>
      <form id="formAdd" action="/add" method="POST" title="Ajouter une dépense">
        
        <div id="firstSelectDiv" class="form-group row">
          <div class="field">
            <label for="type">Type</label>
            <select name="type" id="type">
              <option value="depense">Dépense</option>
              <option value="revenue">Revenu</option>
            </select>
          </div>

          <div class="field">
            <label for="name">Catégorie</label>
            <div class="input-with-action">
              <select name="name" id="name" required>
                <option value="">Sélectionner une catégorie</option>
              </select>
              <button type="button" id="addCategory" class="btn-icon" title="Ajouter une catégorie">
                <img src="/Image/plus.png" alt="+">
              </button>
            </div>
          </div>
        </div>

        <div id="secondSelectDiv" class="form-group row">
          <div class="field">
            <label for="montant">Montant (€)</label>
            <input type="number" inputmode="decimal" min="0.1" id="montant" step="0.01" name="montant" required>
          </div>
        </div>

        <div id="DescripSelectDiv" class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description">
        </div>

        <div id="dateSelectDiv" class="form-group">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput" name="date" required>
        </div>

        <div id="buttonSelectDiv" class="form-actions">
          <button type="submit" id="buttonAdd" name="submit" class="btn-primary">Enregistrer l’activité</button>
        </div>
      </form>
    </section>

    <section id="lastAdd" class="card">
      <h2>Dernières activités</h2>
      <div class="form-group transaction-search">
        <label for="transactionSearch">Rechercher une activité</label>
        <div class="search-controls">
          <input type="search" id="transactionSearch" placeholder="Montant">
          <div class="search-modes" role="group" aria-label="Critère de recherche">
            <button type="button" data-search-mode="amount" aria-label="Montant" title="Montant" aria-pressed="true">💶</button>
            <button type="button" data-search-mode="text" aria-label="Nom ou description" title="Nom ou description" aria-pressed="false">📝</button>
            <button type="button" data-search-mode="date" aria-label="Date" title="Date" aria-pressed="false">📅</button>
          </div>
        </div>
      </div>
      <div id="lastContent"></div>
      <p id="transactionSearchEmpty" role="status" hidden>Aucun résultat.</p>
    </section>
  </main>

  <script src="/log/user.js"></script>
  <script src="main.js"></script>
</body>
</html>
